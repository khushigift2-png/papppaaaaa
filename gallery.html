<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerIQ </title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

:root {
    /* Main Content Background - Father's Day Blue Palette */
    --bg-gradient: linear-gradient(to top, #191970, #1d66ad 40%, #66b3ff);
    --accent-blue: #1d66ad;
    --navy-dark: #191970;
    --sky-light: #66b3ff;
    
    /* Adjusted Step/Poster properties to match clean blue look */
    --step-bg: linear-gradient(90deg, #1d66ad, #191970);
    --step-border: #66b3ff;
    --poster-border: #ffffff;
}

body{
    background:#050505;
    color:white;
    min-height: 100vh;
    overflow-x: hidden;
}

.container{
    display:flex;
    min-height:100vh;
}

/* Sidebar - Deep Contrast Navy/Black */
.sidebar{
    width:280px;
    background:#030712;
    border-right:1px solid #1d66ad;
    display:flex;
    flex-direction:column;
    flex-shrink: 0;
    z-index: 30;
}

.logo{
    padding:25px;
    border-bottom:1px solid rgba(29, 102, 173, 0.3);
}

.logo h2{
    font-size:28px;
    color: #66b3ff;
}

.logo p{
    color:#aaa;
    margin-top:4px;
}

.menu{
    padding:25px 15px;
}

.menu-title{
    color:rgba(102, 179, 255, 0.6);
    font-size:13px;
    margin-bottom:15px;
    letter-spacing:1px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:#ccc;
    padding:16px;
    margin-bottom:10px;
    border-radius:15px;
    transition:.3s;
}

/* Hover & Active States updated to use Theme Blue */
.menu a:hover,
.menu a.active{
    background:rgba(29, 102, 173, 0.25);
    border:1px solid var(--sky-light);
    color:white;
}

.profile{
    margin-top:auto;
    padding:20px;
    border-top:1px solid rgba(29, 102, 173, 0.3);
}

.profile-card{
    background:rgba(29, 102, 173, 0.15);
    border: 1px solid rgba(102, 179, 255, 0.2);
    border-radius:18px;
    padding:15px;
}

.profile h4{
    margin-bottom:5px;
    color: #fff;
}

.profile p{
    color:#aaa;
    font-size:14px;
}

/* Main Content Wrapper */
.main{
    flex:1;
    padding:40px;
    background-image: var(--bg-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 1200px; 
    position: relative;
}

/* Screen Instructions Hint */
.instructions {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(25, 25, 112, 0.85);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    pointer-events: none;
    z-index: 25;
    border: 1px solid var(--sky-light);
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Outer Wrapper to position the staircase viewport */
.scene {
    position: relative;
    width: 0px;
    height: 0px;
    transform-style: preserve-3d;
    transform: rotateX(25deg); 
}

/* The Main Moveable Axis */
.staircase-axis {
    position: absolute;
    width: 0px;
    height: 0px;
    transform-style: preserve-3d;
    transform: translateY(0px) rotateY(0deg);
    transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1); 
}

/* Individual Steps */
.step {
    position: absolute;
    width: 160px;
    height: 15px;
    background: var(--step-bg);
    border: 1px solid var(--step-border);
    border-radius: 2px;
    transform-origin: left center;
    
    transform: 
    rotateY(calc(var(--i) * 18deg)) 
    translateY(calc(var(--i) * 28px)) 
    translateZ(100px);
}

/* Poster Styling */
.poster {
    position: absolute;
    bottom: 15px;
    left: 30px;
    width: 100px;
    height: 140px;
    background: var(--navy-dark);
    border: 4px solid var(--poster-border);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(5px);
    object-fit: cover;
}

/* Center Pole */
.axis-pole {
    position: absolute;
    width: 12px;
    height: 3000px; 
    background: linear-gradient(90deg, #111, var(--accent-blue), #111);
    top: 0;
    left: -6px;
}

.glass-ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: linear-gradient(to bottom, rgba(25, 25, 112, 0.2), #191970);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid rgba(102, 179, 255, 0.2);
    z-index: 20;
}

@media(max-width:768px){
    .sidebar{
        display:none;
    }
}
</style>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <h2>Father's Day</h2>
            <p>Gift Platform</p>
        </div>

         <div class="menu">
            <div class="menu-title">Gifts</div>
            <a href="main page.html" >📊 Main Page</a>
            <a href="together.html">📹 Together</a>
            <a href="gallery.html"class="active">📸 Gallery</a>
            <a href="games.html">🎮 Games</a>
            
        </div>

        <div class="profile">
            <div class="profile-card">
                <h4>Naincy Prakash</h4>
                <h4>Umang Prakash</h4>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="instructions">📜 Scroll Mouse Wheel or Swipe Up/Down to explore all photos</div>

        <div class="scene">
            <div class="staircase-axis" id="staircase">
                <div class="axis-pole"></div>
            </div>
        </div>

        <div class="glass-ground"></div>
    </main>

</div>

<script>
    const staircase = document.getElementById('staircase');
    const totalPosters = 19;
    const stepsPerPoster = 5; 
    const totalSteps = totalPosters * stepsPerPoster; 
    
    let posterCount = 1;

    // 1. Generate the staircase steps dynamically
    for (let i = 1; i <= totalSteps; i++) {
        const step = document.createElement('div');
        step.classList.add('step');
        step.style.setProperty('--i', i);

        if (i % stepsPerPoster === 0) {
            const img = document.createElement('img');
            img.classList.add('poster');
            img.src = `gallery%20photo/${posterCount}.jpeg`;
            img.alt = `Poster ${posterCount}`;
            
            step.appendChild(img);
            posterCount++;
        }

        staircase.appendChild(step);
    }

    // 2. Interactive Scroll Control
    let scrollPosition = 0;

    function updateStaircase() {
        const translateY = -scrollPosition * 0.45; 
        const rotateY = -scrollPosition * 0.28;     
        
        staircase.style.transform = `translateY(${translateY}px) rotateY(${rotateY}deg)`;
    }

    // Desktop Mousewheel
    window.addEventListener('wheel', (e) => {
        scrollPosition += e.deltaY;
        scrollPosition = Math.max(0, Math.min(scrollPosition, 9200)); 
        updateStaircase();
    });

    // Mobile Swipe
    let touchStart = 0;
    window.addEventListener('touchstart', (e) => {
        touchStart = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
        const touchEnd = e.touches[0].clientY;
        const delta = touchStart - touchEnd;
        scrollPosition += delta * 2; 
        scrollPosition = Math.max(0, Math.min(scrollPosition, 9200));
        touchStart = touchEnd;
        updateStaircase();
    });
</script>

</body>
</html>
