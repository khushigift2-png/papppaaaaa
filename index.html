```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Father's Day Dark Theme</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#66b3ff;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* Top Shape */
.top-shape{
    position:absolute;
    top:0;
    left:0;
    width:320px;
    height:180px;
    background:#1d66ad;
    border-bottom-right-radius:120px;
    z-index:0;
}

/* Header */
header{
    display:flex;
    justify-content:flex-end;
    padding:25px 8%;
    position:relative;
    z-index:10;
}

/* Buttons */
.login,
.btn{
    position:relative;
    overflow:visible;
    transition:all .3s ease;
}

.login{
    padding:12px 28px;
    border:2px solid #1d66ad;
    border-radius:30px;
    background:#fff;
    color:#191970;
    font-weight:600;
    cursor:pointer;
}

.btn{
    margin-top:25px;
    padding:15px 35px;
    border:2px solid #1d66ad;
    border-radius:30px;
    background:white;
    color:#191970;
    font-weight:700;
    cursor:pointer;
}

/* Glow Effect */
.login::before,
.btn::before{
    content:"";
    position:absolute;
    inset:-10px;
    background:white;
    border-radius:40px;
    filter:blur(20px);
    opacity:0;
    z-index:-1;
    transition:.3s;
}

.login:hover,
.btn:hover{
    transform:scale(1.08);
}

.login:hover::before,
.btn:hover::before{
    opacity:.6;
}

.login:active,
.btn:active{
    transform:scale(1.12);
}

.login:active::before,
.btn:active::before{
    opacity:1;
}

/* Pulse Animation */
@keyframes pulseGlow{
    0%{
        box-shadow:0 0 10px rgba(236, 234, 234, 0.5);
    }
    50%{
        box-shadow:0 0 40px rgb(253, 252, 252);
    }
    100%{
        box-shadow:0 0 10px rgba(236, 234, 234, 0.5);
    }
}

/* Hero */
.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:85vh;
    padding:40px 8%;
}

.content{
    max-width:650px;
    position:relative;
    z-index:5;
}

/* Title */
.title{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.happy{
    font-size:90px;
    font-weight:800;
    color:#191970;
    line-height:1;
    margin-bottom:15px;
}

.father{
    display:inline-block;
    background:#1d66ad;
    color:white;
    padding:12px 28px;
    border-radius:12px;
    font-size:60px;
    font-weight:800;
    margin-bottom:10px;
}

.day{
    font-size:110px;
    font-weight:800;
    color:#191970;
    line-height:.9;
}

/* Hearts */
.discounts{
    position:relative;
    width:320px;
    height:180px;
    margin:40px 0;
}

.heart{
    width:90px;
    height:90px;
    background:#1d66ad;
    position:absolute;
    left:0;
    top:0;
    transform:rotate(-45deg);
    display:flex;
    justify-content:center;
    align-items:center;
}

.heart::before,
.heart::after{
    content:"";
    width:90px;
    height:90px;
    background:#1d66ad;
    border-radius:50%;
    position:absolute;
}

.heart::before{
    top:-45px;
    left:0;
}

.heart::after{
    left:45px;
    top:0;
}

.heart span{
    color:white;
    font-size:26px;
    font-weight:800;
    transform:rotate(45deg);
    z-index:2;
}

.heart.small{
    width:70px;
    height:70px;
    left:180px;
    top:75px;
}

.heart.small::before,
.heart.small::after{
    width:70px;
    height:70px;
}

.heart.small::before{
    top:-35px;
}

.heart.small::after{
    left:35px;
}

.heart.small span{
    font-size:20px;
}

/* Text */
.content p{
    color:#d1d5db;
    max-width:500px;
    line-height:1.8;
}

/* Image */
.image{
    display:flex;
    justify-content:center;
    position:relative;
    z-index:5;
}

.photo{
    background:#1e1e1e;
    padding:18px;
    transform:rotate(-5deg);
    position:relative;
    z-index:5;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.photo::before,
.photo::after{
    content:"";
    width:15px;
    height:60px;
    background:#1d66ad;
    position:absolute;
    top:-20px;
}

.photo::before{
    left:40px;
}

.photo::after{
    right:40px;
}

.photo img{
    width:450px;
    height:550px;
    object-fit:cover;
    display:block;
}

/* Decorations */
.dot{
    position:absolute;
    color:#1d66ad;
    opacity:.15;
    z-index:0;
}

.d1{
    top:180px;
    right:180px;
    font-size:120px;
}

.d2{
    top:360px;
    right:320px;
    font-size:90px;
}

.d3{
    bottom:120px;
    right:180px;
    font-size:100px;
}

.bottom-circle{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:#1d66ad;
    opacity:.2;
    bottom:-80px;
    right:-80px;
}

/* Responsive */
@media(max-width:1000px){

    .hero{
        flex-direction:column;
        text-align:center;
        gap:60px;
    }

    .title{
        align-items:center;
    }

    .discounts{
        margin:40px auto;
    }

    .happy{
        font-size:60px;
    }

    .father{
        font-size:40px;
    }

    .day{
        font-size:80px;
    }

    .photo img{
        width:320px;
        height:400px;
    }

   .d1{
    top:120px;
    right:220px;
    font-size:140px;
}
.d2{
    top:100px;
    right:1800px;
    font-size:140px;
}
.d3{
    top:160px;
    right:120px;
    font-size:140px;
}
}

</style>
</head>

<body>

<div class="top-shape"></div>

<header>
    <a href="main page.html" style="text-decoration: none;">
    <button class="login">GIFT</button>
    </a>
</header>

<section class="hero">

    <div class="content">

        <div class="title">
            <div class="happy">HAPPY</div>
            <div class="father">FATHER'S</div>
            <div class="day">DAY</div>
        </div>

        <div class="discounts">

            <div class="heart">
                <span>Khushi</span>
            </div>

            <div class="heart small">
                <span>Gift2</span>
            </div>

        </div>

        <p>
            Happy Father's Day! Thank you for your endless love, guidance, and support. You inspire me every day
             with your strength and kindness. Wishing you happiness, health, and a wonderful day.

        </p>
        <a href="main page.html" style="text-decoration: none;">
        <button class="btn">OPEN GIFT</button>
        </a>

    </div>

    <div class="image">
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?w=900"
                 alt="Father and Son">
        </div>
    </div>

</section>

<div class="dot d1">❤</div>
<div class="dot d2">🎁</div>
<div class="dot d3">👓</div>

<div class="bottom-circle"></div>

<script>
document.querySelectorAll('.login, .btn').forEach(button => {

    button.addEventListener('click', function(){

        this.style.animation = "pulseGlow 1s infinite";

        setTimeout(() => {
            this.style.animation = "";
        }, 3000);

    });

});
</script>

</body>
</html>
```
