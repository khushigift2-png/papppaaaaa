<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Drag & Drop Photo Puzzle</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Fireworks Overlay Canvas */
        #fw-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0 0 30px 0;
            font-size: 1rem;
            z-index: 2;
        }

        /* Glassmorphism Container */
        .main-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
            z-index: 2;
        }

        .options-panel {
            width: 100%;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .thumb-wrapper {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .thumb-wrapper:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .thumb-wrapper.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.3);
        }

        .img-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .action-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Centered Core Controls */
        .center-controls {
            display: flex;
            justify-content: center;
            width: 100%;
            margin: 10px 0 25px 0;
        }

        .btn-shuffle {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            font-size: 1.05rem;
            padding: 14px 32px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
            width: 85%;
        }

        .btn-shuffle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.6);
        }

        #camera-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        #video {
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            transform: scaleX(-1);
            border: 2px solid var(--card-border);
        }

        /* Drag & Drop Puzzle Board */
        #puzzle-container {
            width: 380px;
            height: 380px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            overflow: hidden;
            margin-bottom: 20px;
            transition: gap 0.4s ease, border-color 0.4s;
        }

        /* Solved puzzle merging style */
        #puzzle-container.solved {
            gap: 0px !important;
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .tile {
            background-size: 380px 380px;
            cursor: grab;
            transition: box-shadow 0.2s, filter 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-size: 1.25rem;
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
            touch-action: none; /* Prevents scrolling while dragging on mobile */
        }

        .tile:active {
            cursor: grabbing;
        }

        .tile.dragging {
            opacity: 0.5;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.8);
        }

        .tile.drag-over {
            filter: brightness(1.3);
            box-shadow: inset 0 0 0 3px var(--primary);
        }

        #puzzle-container.solved .tile {
            border-radius: 0px;
            box-shadow: none;
            cursor: default;
            text-indent: -9999px; /* Hide helper numbers upon winning */
        }

        .tile:hover:not(.dragging) {
            filter: brightness(1.1);
        }

        #status {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
            min-height: 24px;
        }

        .win-message {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        #file-input { display: none; }

        @media (max-width: 440px) {
            #puzzle-container { width: 300px; height: 300px; }
            .tile { background-size: 300px 300px; font-size: 1.1rem; }
            .main-container { padding: 20px; }
        }
    </style>
</head>
<body>
<body>

    <a href="games.html" style="
        position: absolute;
        top: 25px;
        left: 8%;
        z-index: 100;
        text-decoration: none;
        padding: 10px 20px;
        background-color: #ffffff;
        color: #191970;
        border: 2px solid #1d66ad;
        border-radius: 30px;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        display: inline-block;
    ">
        ⬅ Go Back
    </a>
    <div class="top-shape"></div>
    
    
    <!-- Fireworks Canvas Layer -->
    <canvas id="fw-canvas"></canvas>

    <h1>Photo Sliding Puzzle</h1>
    <p class="subtitle">Drag and swap any piece to fix the picture!</p>

    <div class="main-container">
        
        <div class="options-panel">
            <div class="section-title">Choose artwork template</div>
            <div class="image-grid" id="presets-grid">
                <div class="thumb-wrapper selected" onclick="selectImage('https://picsum.photos/id/10/600/600', this)">
                    <img class="img-thumb" src="https://picsum.photos/id/10/150/150" alt="Nature">
                </div>
                <div class="thumb-wrapper" onclick="selectImage('https://picsum.photos/id/1025/600/600', this)">
                    <img class="img-thumb" src="https://picsum.photos/id/1025/150/150" alt="Pug">
                </div>
                <div class="thumb-wrapper" onclick="selectImage('https://picsum.photos/id/1043/600/600', this)">
                    <img class="img-thumb" src="https://picsum.photos/id/1043/150/150" alt="Landscape">
                </div>
                <div class="thumb-wrapper" onclick="selectImage('https://picsum.photos/id/237/600/600', this)">
                    <img class="img-thumb" src="https://picsum.photos/id/237/150/150" alt="Puppy">
                </div>
            </div>

            <div class="action-row">
                <button class="btn btn-secondary" onclick="triggerCamera()">📷 Live Photo</button>
                <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📁 Upload File</button>
                <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
            </div>
        </div>

        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="action-row" style="width: 100%; max-width: 280px;">
                <button class="btn btn-primary" style="flex:1;" onclick="capturePhoto()">📸 Snap</button>
                <button class="btn btn-secondary" style="padding: 10px;" onclick="stopCamera()">X</button>
            </div>
        </div>

        <!-- Center Shuffling Control Button -->
        <div class="center-controls">
            <button class="btn btn-shuffle" onclick="shuffleBoard()">🔀 Shuffle & Start</button>
        </div>

        <!-- Puzzle Interaction Board Container -->
        <div id="puzzle-container"></div>
        
        <div id="status">Click "Shuffle & Start" to play!</div>
    </div>

    <canvas id="hidden-canvas" style="display:none;" width="600" height="600"></canvas>

    <script>
        const size = 3; 
        let boardState = []; // Holds current visual assignments
        let currentImgUrl = 'https://picsum.photos/id/10/600/600'; 
        let stream = null;
        let isPlaying = false;
        let draggedPosition = null;

        const container = document.getElementById('puzzle-container');
        const statusText = document.getElementById('status');
        const video = document.getElementById('video');
        const cameraContainer = document.getElementById('camera-container');

        // Fireworks Particle Framework Engine
        const fwCanvas = document.getElementById('fw-canvas');
        const fwCtx = fwCanvas.getContext('2d');
        let particles = [];
        let fwAnimationId = null;

        function resizeFwCanvas() {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFwCanvas);
        resizeFwCanvas();

        function initGame() {
            isPlaying = false;
            container.classList.remove('solved');
            boardState = Array.from({length: size * size}, (_, i) => i);
            stopFireworks();
            renderBoard();
        }

        function renderBoard() {
            container.innerHTML = '';
            
            let isSolved = isPlaying && boardState.every((val, index) => val === index);

            if (isSolved) {
                container.classList.add('solved');
                statusText.innerHTML = '<span class="win-message">✨ Puzzle Complete! Splendid! ✨</span>';
                isPlaying = false;
                startFireworks();
            }

            const computedWidth = container.clientWidth;

            boardState.forEach((tileIndex, position) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.style.backgroundSize = `${computedWidth}px ${computedWidth}px`;
                tile.style.backgroundImage = `url('${currentImgUrl}')`;
                
                // Track correct image background segment cuts
                const row = Math.floor(tileIndex / size);
                const col = tileIndex % size;
                const posX = (col / (size - 1)) * 100;
                const posY = (row / (size - 1)) * 100;
                tile.style.backgroundPosition = `${posX}% ${posY}%`;
                tile.innerText = tileIndex + 1;

                // Bind HTML Drag and Drop Events if game is running
                if (!isSolved && isPlaying) {
                    tile.setAttribute('draggable', 'true');
                    
                    tile.addEventListener('dragstart', (e) => {
                        draggedPosition = position;
                        tile.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', position);
                    });

                    tile.addEventListener('dragend', () => {
                        tile.classList.remove('dragging');
                        document.querySelectorAll('.tile').forEach(t => t.classList.remove('drag-over'));
                    });

                    tile.addEventListener('dragover', (e) => {
                        e.preventDefault(); // Required to drop things
                        if(position !== draggedPosition) {
                            tile.classList.add('drag-over');
                        }
                    });

                    tile.addEventListener('dragleave', () => {
                        tile.classList.remove('drag-over');
                    });

                    tile.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const sourcePosition = parseInt(e.dataTransfer.getData('text/plain'), 10);
                        swapTiles(sourcePosition, position);
                    });
                }
                container.appendChild(tile);
            });
        }

        // Action processor to swap pieces 
        function swapTiles(pos1, pos2) {
            if (pos1 === pos2) return;
            [boardState[pos1], boardState[pos2]] = [boardState[pos2], boardState[pos1]];
            renderBoard();
        }

        // Shuffle mixes up the indexes completely for freedom layout mapping
        function shuffleBoard() {
            stopFireworks();
            container.classList.remove('solved');
            statusText.innerText = "Pick up any piece and place it anywhere!";
            isPlaying = true;

            // Fisher-Yates shuffle variant algorithm logic mapping
            for (let i = boardState.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boardState[i], boardState[j]] = [boardState[j], boardState[i]];
            }

            // Fallback guard to guarantee it doesn't instantly shuffle into a pre-solved array state
            if(boardState.every((val, index) => val === index)) {
                [boardState[0], boardState[1]] = [boardState[1], boardState[0]];
            }

            renderBoard();
        }

        /* Firework Animation FX Engine Logic Loop */
        function createFirework(x, y) {
            const colors = ['#ff4757', '#eccc68', '#1e90ff', '#2ed573', '#ffa502', '#ff6b81', '#70a1ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: color,
                    size: Math.random() * 3 + 1.5
                });
            }
        }

        function updateFireworks() {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            if (Math.random() < 0.05) {
                createFirework(Math.random() * fwCanvas.width, Math.random() * (fwCanvas.height * 0.6));
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.04; p.alpha -= 0.012;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    fwCtx.save();
                    fwCtx.globalAlpha = p.alpha;
                    fwCtx.fillStyle = p.color;
                    fwCtx.beginPath();
                    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    fwCtx.fill();
                    fwCtx.restore();
                }
            }
            fwAnimationId = requestAnimationFrame(updateFireworks);
        }

        function startFireworks() {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createFirework(centerX - 80, centerY);
            createFirework(centerX + 80, centerY);
            if(!fwAnimationId) updateFireworks();
        }

        function stopFireworks() {
            if(fwAnimationId) {
                cancelAnimationFrame(fwAnimationId);
                fwAnimationId = null;
            }
            particles = [];
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
        }

        function selectImage(url, element) {
            document.querySelectorAll('.thumb-wrapper').forEach(el => el.classList.remove('selected'));
            if(element) element.closest('.thumb-wrapper').classList.add('selected');
            currentImgUrl = url;
            initGame();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    removeGridSelection();
                    selectImage(e.target.result, null);
                };
                reader.readAsDataURL(file);
            }
        }

        async function triggerCamera() {
            cameraContainer.style.display = 'flex';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                alert("Webcam connection failed. Check browser permissions.");
                cameraContainer.style.display = 'none';
            }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            cameraContainer.style.display = 'none';
        }

        function capturePhoto() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2;
            const sy = (video.videoHeight - minDim) / 2;

            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0); 

            const dataUrl = canvas.toDataURL('image/jpeg');
            removeGridSelection();
            selectImage(dataUrl, null);
            stopCamera();
        }

        function removeGridSelection() {
            document.querySelectorAll('.thumb-wrapper').forEach(el => el.classList.remove('selected'));
        }

        window.addEventListener('resize', () => { if(!isPlaying) renderBoard(); });
        
        initGame();
    </script>
</body>
</html>
